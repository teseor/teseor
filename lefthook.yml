min_version: 2.1.0

commit-msg:
  commands:
    conventional:
      run: node scripts/verify-commit.js {1}

pre-commit:
  parallel: true
  commands:
    biome:
      glob: '*.{ts,tsx,js,mjs,cjs,json}'
      run: pnpm exec biome check --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
    stylelint:
      glob: '*.css'
      run: pnpm exec stylelint --allow-empty-input {staged_files}
    spec:
      glob: 'specs/*.yaml'
      run: pnpm lint:spec
    no-plan-markers:
      glob: '*.{ts,tsx,js,jsx,mjs,cjs,css,scss,yaml,yml,sh,md}'
      run: node scripts/check-comments.js {staged_files}
    logical-naming:
      glob: '*.{ts,tsx,js,yaml,yml}'
      run: node scripts/check-logical-naming.js {staged_files}
    dogfood:
      glob: 'apps/docs/**'
      run: node scripts/check-dogfood.ts
    component-css:
      glob: 'packages/css/src/components/**/*.css'
      run: node scripts/check-component-css.ts

pre-push:
  commands:
    lint:
      run: pnpm lint
    typecheck:
      run: pnpm typecheck
    test:
      run: pnpm test
    gen-drift:
      run: |
        set -e
        before="$(git status --porcelain)$(git diff HEAD)"
        pnpm gen
        if [ "$before" != "$(git status --porcelain)$(git diff HEAD)" ]; then
          echo "pnpm gen changed generated output — commit the regenerated files."
          git --no-pager diff
          exit 1
        fi
    verify-no-dev-leak:
      run: pnpm -r --if-present run build && pnpm verify:no-dev-leak
    measure:
      run: pnpm build:css && pnpm size
    changeset:
      run: node scripts/check-changeset.js
