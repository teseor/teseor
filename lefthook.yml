min_version: 2.1.0

commit-msg:
  commands:
    conventional:
      run: node scripts/verify-commit.js {1}

pre-commit:
  parallel: true
  commands:
    biome:
      glob: '*.{ts,tsx,js,mjs,cjs,json}'
      run: pnpm exec biome check --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
    stylelint:
      glob: '*.css'
      run: pnpm exec stylelint --allow-empty-input {staged_files}
    spec:
      glob: 'specs/*.yaml'
      run: pnpm lint:spec
    no-plan-markers:
      glob: '*.{ts,tsx,js,jsx,mjs,cjs,css,scss,yaml,yml,sh,md}'
      run: node scripts/check-comments.js {staged_files}
    logical-naming:
      glob: '*.{ts,tsx,js,yaml,yml}'
      run: node scripts/check-logical-naming.js {staged_files}
    dogfood:
      glob: 'apps/docs/**'
      run: node scripts/check-dogfood.ts
    component-css:
      glob: 'packages/css/src/components/**/*.css'
      run: node scripts/check-component-css.ts
    motion:
      glob: 'packages/css/src/components/**/*.css'
      run: node scripts/check-motion-scale.ts
    transitionable:
      glob: 'packages/css/src/components/**/*.css'
      run: node scripts/check-transitionable-property.ts
    aggregators:
      glob: '{**/package.json,pnpm-workspace.yaml}'
      run: node scripts/check-script-aggregators.ts
    catalog:
      glob: '{package.json,docs/process/dev-scripts.md}'
      run: node scripts/check-script-catalog.ts
    markdown:
      glob: '**/*.md'
      run: pnpm exec markdownlint-cli2
    doc-paths:
      glob: '**/*.{md,mdx}'
      run: node scripts/check-doc-paths.ts
    contract-snapshots:
      glob: '{tests/contract/**,specs/**,apps/harness/src/fixtures/**}'
      run: node scripts/check-contract-snapshots.ts

pre-push:
  commands:
    # Opt-in local pre-flight review. Enable per-clone with:
    #   touch .claude/preflight-review.enabled
    # Disable with: rm .claude/preflight-review.enabled
    # Warn-only — prints suggestions, never blocks the push.
    # `interactive: true` streams the review output (and any install hint from
    # the script) directly to the terminal; lefthook hides stdout from
    # success-path commands by default.
    preflight-review:
      interactive: true
      run: |
        if [ ! -f .claude/preflight-review.enabled ]; then exit 0; fi
        bash scripts/review.sh || true
    lint:
      run: pnpm lint
    typecheck:
      run: pnpm typecheck
    test:
      run: pnpm test
    gen-drift:
      run: |
        set -e
        before="$(git status --porcelain)$(git diff HEAD)"
        pnpm gen
        if [ "$before" != "$(git status --porcelain)$(git diff HEAD)" ]; then
          echo "pnpm gen changed generated output — commit the regenerated files."
          git --no-pager diff
          exit 1
        fi
    verify-no-dev-leak:
      run: pnpm -r --if-present run build && pnpm verify:no-dev-leak
    measure:
      run: pnpm build:css && pnpm size
    changeset:
      run: node scripts/check-changeset.js
