min_version: 2.1.0

commit-msg:
  commands:
    conventional:
      run: node scripts/hooks/commit-msg.js {1}

# Pre-commit dispatches every project lint check through one runner. The
# registry (`scripts/lint/registry.ts`) is the catalog: each entry declares
# its own trigger pathspecs, and the runner skips checks whose triggers
# don't intersect the staged file list. `--list` shows the full catalog.
pre-commit:
  commands:
    project:
      run: node scripts/lint/run.ts --all {staged_files}

pre-push:
  commands:
    # Opt-in local pre-flight review. Enable per-clone with:
    #   touch .claude/preflight-review.enabled
    # Disable with: rm .claude/preflight-review.enabled
    # Warn-only — prints suggestions, never blocks the push.
    # `interactive: true` streams the review output (and any install hint from
    # the script) directly to the terminal; lefthook hides stdout from
    # success-path commands by default.
    # `skip_empty: false` forces the command to run even when the push range
    # has no file changes (the script computes its own diff vs $BASE).
    preflight-review:
      interactive: true
      skip_empty: false
      run: |
        if [ ! -f .claude/preflight-review.enabled ]; then exit 0; fi
        bash scripts/repo/review.sh || true
    lint:
      run: pnpm lint
    typecheck:
      run: pnpm typecheck
    test:
      run: pnpm test
    gen-drift:
      run: |
        set -e
        before="$(git status --porcelain)$(git diff HEAD)"
        pnpm gen
        if [ "$before" != "$(git status --porcelain)$(git diff HEAD)" ]; then
          echo "pnpm gen changed generated output — commit the regenerated files."
          git --no-pager diff
          exit 1
        fi
    sync-labels-drift:
      glob: "specs/*.yaml"
      run: node scripts/repo/sync-labels.ts --check
    contract-snapshots:
      glob:
        - "specs/**/*.yaml"
        - "scripts/codegen/**"
        - "apps/harness/src/fixtures/**"
        - "packages/primitives/src/**"
        - "packages/react/src/**/*.tsx"
        - "packages/vue/src/**/*.vue"
        - "tests/contract/**"
      run: pnpm test:e2e tests/contract --project=chromium
    verify-no-dev-leak:
      run: pnpm -r --if-present run build && node scripts/hooks/verify-no-dev-leak.js
    measure:
      run: pnpm build:css && pnpm size

# `packages/css/dist/**` is gitignored, so pulling/merging new CSS sources
# leaves it stale relative to `packages/css/src/**`. Consumers that import
# `@teseor/css/components/<name>.css` (the wrappers, the docs, the harness)
# then fail to resolve. This hook rebuilds dist whenever the merged range
# changed CSS sources — runs ~1s and only when the glob matches.
post-merge:
  files: git diff-tree -r --name-only --no-commit-id ORIG_HEAD HEAD
  commands:
    rebuild-css:
      glob: "packages/css/src/**"
      run: pnpm build:css
