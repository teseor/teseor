<!-- default -->
<span class="t-badge">Label</span>

<!-- solid-success -->
<span class="t-badge" data-intent="success">Label</span>

<!-- outline-info -->
<span class="t-badge" data-intent="info" data-variant="outline">Label</span>

<!-- ghost-danger -->
<span class="t-badge" data-intent="danger" data-variant="ghost">Label</span>

<!-- pill -->
<span class="t-badge" data-intent="primary" data-shape="pill">Label</span>

<!-- with-icon -->
<span class="t-badge" data-intent="success"><span data-badge-icon=""><span data-fixture-slot="dot"></span></span>Label</span>

<!-- small -->
<span class="t-badge" data-size="sm">Label</span>

<!-- large -->
<span class="t-badge" data-intent="warning" data-size="lg">Label</span>
