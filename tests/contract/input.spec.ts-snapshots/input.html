<!-- default -->
<input class="t-input" placeholder="Your name"></input>

<!-- variant-outline -->
<input class="t-input" data-variant="outline" placeholder="Email"></input>

<!-- variant-subtle -->
<input class="t-input" data-variant="subtle" placeholder="Email"></input>

<!-- variant-plain -->
<input class="t-input" data-variant="plain" placeholder="Email"></input>

<!-- size-sm -->
<input class="t-input" data-size="sm" placeholder="Compact"></input>

<!-- size-lg -->
<input class="t-input" data-size="lg" placeholder="Emphatic"></input>

<!-- type-email -->
<input class="t-input" placeholder="you@example.com" type="email"></input>

<!-- type-number -->
<input class="t-input" placeholder="42" type="number"></input>

<!-- type-password -->
<input class="t-input" placeholder="Password" type="password"></input>

<!-- invalid -->
<input class="t-input" data-invalid="true" placeholder="Required"></input>

<!-- disabled -->
<input class="t-input" disabled="" placeholder="Disabled"></input>

<!-- form-control -->
<input class="t-input" form="contact" name="email" placeholder="Form-control attributes pass-through" readonly="" required=""></input>
