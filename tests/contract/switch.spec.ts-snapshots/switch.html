<!-- default -->
<input class="t-switch" role="switch" type="checkbox"></input>

<!-- checked -->
<input checked="" class="t-switch" role="switch" type="checkbox"></input>

<!-- size-sm -->
<input class="t-switch" data-size="sm" role="switch" type="checkbox"></input>

<!-- size-lg -->
<input class="t-switch" data-size="lg" role="switch" type="checkbox"></input>

<!-- size-lg-checked -->
<input checked="" class="t-switch" data-size="lg" role="switch" type="checkbox"></input>

<!-- disabled -->
<input class="t-switch" disabled="" role="switch" type="checkbox"></input>

<!-- disabled-checked -->
<input checked="" class="t-switch" disabled="" role="switch" type="checkbox"></input>

<!-- form-control -->
<input checked="" class="t-switch" form="settings" name="notifications" required="" role="switch" type="checkbox"></input>
