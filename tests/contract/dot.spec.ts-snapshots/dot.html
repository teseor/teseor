<!-- default -->
<span aria-hidden="true" class="t-dot" role="none">Label</span>

<!-- success -->
<span aria-hidden="true" class="t-dot" data-color="success" role="none">Label</span>

<!-- small -->
<span aria-hidden="true" class="t-dot" data-size="sm" role="none">Label</span>

<!-- status-online -->
<span aria-hidden="true" class="t-dot" data-status="online" role="none">Label</span>

<!-- status-busy -->
<span aria-hidden="true" class="t-dot" data-status="busy" role="none">Label</span>

<!-- labeled -->
<span aria-label="Online" class="t-dot" role="img">Label</span>
