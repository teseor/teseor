<!-- default -->
<textarea class="t-textarea" placeholder="Your message"></textarea>

<!-- variant-outline -->
<textarea class="t-textarea" data-variant="outline" placeholder="Comment"></textarea>

<!-- variant-subtle -->
<textarea class="t-textarea" data-variant="subtle" placeholder="Comment"></textarea>

<!-- variant-plain -->
<textarea class="t-textarea" data-variant="plain" placeholder="Comment"></textarea>

<!-- size-sm -->
<textarea class="t-textarea" data-size="sm" placeholder="Compact"></textarea>

<!-- size-lg -->
<textarea class="t-textarea" data-size="lg" placeholder="Emphatic"></textarea>

<!-- rows-2 -->
<textarea class="t-textarea" placeholder="Two rows" rows="2"></textarea>

<!-- rows-6 -->
<textarea class="t-textarea" placeholder="Six rows" rows="6"></textarea>

<!-- resize-none -->
<textarea class="t-textarea" data-resize="none" placeholder="Fixed height"></textarea>

<!-- resize-both -->
<textarea class="t-textarea" data-resize="both" placeholder="Resize both directions"></textarea>

<!-- invalid -->
<textarea class="t-textarea" data-invalid="true" placeholder="Required"></textarea>

<!-- disabled -->
<textarea class="t-textarea" disabled="" placeholder="Disabled"></textarea>

<!-- form-control -->
<textarea class="t-textarea" form="contact" name="comment" placeholder="Form-control attributes pass-through" readonly="" required=""></textarea>
