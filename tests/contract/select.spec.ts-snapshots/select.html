<!-- default -->
<select class="t-select">Label</select>

<!-- variant-outline -->
<select class="t-select" data-variant="outline">Label</select>

<!-- variant-subtle -->
<select class="t-select" data-variant="subtle">Label</select>

<!-- variant-plain -->
<select class="t-select" data-variant="plain">Label</select>

<!-- size-sm -->
<select class="t-select" data-size="sm">Label</select>

<!-- size-lg -->
<select class="t-select" data-size="lg">Label</select>

<!-- multiple -->
<select class="t-select" multiple="">Label</select>

<!-- invalid -->
<select class="t-select" data-invalid="true">Label</select>

<!-- disabled -->
<select class="t-select" disabled="">Label</select>

<!-- form-control -->
<select class="t-select" form="contact" name="country" required="">Label</select>
