<!-- default -->
<input class="t-radio" type="radio"></input>

<!-- checked -->
<input checked="" class="t-radio" type="radio"></input>

<!-- size-sm -->
<input class="t-radio" data-size="sm" type="radio"></input>

<!-- size-lg -->
<input class="t-radio" data-size="lg" type="radio"></input>

<!-- size-lg-checked -->
<input checked="" class="t-radio" data-size="lg" type="radio"></input>

<!-- disabled -->
<input class="t-radio" disabled="" type="radio"></input>

<!-- disabled-checked -->
<input checked="" class="t-radio" disabled="" type="radio"></input>

<!-- form-control -->
<input class="t-radio" form="signup" name="plan" required="" type="radio"></input>
