description: Buttons trigger actions. Use primary for main CTA, secondary for less important actions.

sections:
  variants:
    modifier: variant
    layout: row
    include_default: true
    description: $shared.variant

  sizes:
    modifier: size
    layout: row
    description: $shared.size

  radius:
    modifier: radius
    layout: row
    include_default: true
    description: Override border radius. Use radius-full for pill-shaped buttons.

  block:
    modifier: block
    text: Block Button
    description: $shared.block

  loading:
    modifier: loading
    layout: row
    description: $shared.loading
    combine:
      - {}
      - { variant: secondary }

  icon_only:
    modifier: icon
    layout: row
    description: Square icon-only buttons.
    combine:
      - { size: sm }
      - {}
      - { size: lg }

  with_icon:
    layout: row
    description: Buttons with icon and text.
    examples:
      - component: Button
        children:
          - component: ButtonIcon
            props: { start: true }
            icon: plus
          - text: Add Item
      - component: Button
        props: { variant: secondary }
        children:
          - text: Next
          - component: ButtonIcon
            props: { end: true }
            icon: chevron-right
