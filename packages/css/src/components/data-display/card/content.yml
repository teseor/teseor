description: Container for grouped content with optional media and body sections.

sections:
  default:
    examples:
      - component: Card
        children:
          - component: CardBody
            text: Basic card with body content.

  variants:
    modifier: variant
    layout: row
    include_default: true
    description: $shared.variant

  sizes:
    modifier: size
    layout: row
    include_default: true
    description: $shared.size

  flush:
    modifier: flush
    description: $shared.flush

  interactive:
    modifier: interactive
    description: $shared.interactive
    template:
      component: Card
      children:
        - component: CardBody
          text: Clickable card with hover state.

  responsive:
    modifier: responsive
    description: Switches from horizontal to vertical layout on small screens.
    template:
      component: Card
      children:
        - component: CardMedia
        - component: CardBody
          text: Responsive card content.

  with_media:
    description: Card with media and body sections.
    examples:
      - component: Card
        children:
          - component: CardMedia
          - component: CardBody
            text: Card with media area above the body.
