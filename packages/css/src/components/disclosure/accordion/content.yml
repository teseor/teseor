description: Expandable content sections for progressive disclosure.

sections:
  default:
    examples:
      - component: Accordion
        children:
          - element: details
            children:
              - element: summary
                text: Section 1
              - element: div
                text: Content for section 1.
          - element: details
            children:
              - element: summary
                text: Section 2
              - element: div
                text: Content for section 2.

  separated:
    modifier: separated
    description: $shared.separated
    template:
      component: Accordion
      children:
        - element: details
          children:
            - element: summary
              text: Section 1
            - element: div
              text: Content for section 1.
        - element: details
          children:
            - element: summary
              text: Section 2
            - element: div
              text: Content for section 2.
