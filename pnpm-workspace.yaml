packages:
  - 'packages/*'
  - 'apps/*'
  - 'scripts/codegen'
overrides:
  # Lifts every `yaml` past the < 2.8.3 stack-overflow advisory — see #625.
  # Drop this once no transitive dependency resolves `yaml` below 2.8.3.
  yaml: '^2.8.3'
allowBuilds:
  esbuild: false
  sharp: false
  lefthook: true
minimumReleaseAgeExclude:
  - astro@6.3.7
