name: textarea
description: 'Multi-line text input. Styled `<textarea>` with token-driven defaults and outline / subtle / plain visual variants. Native attributes (`rows`, `cols`, `placeholder`, `value`, `defaultValue`, `maxLength`, etc.) pass through `ComponentProps<"textarea">`. Form-association attributes (`name`, `form`, `required`, `readOnly`, `disabled`) come from the formControl shared contract.'
kind: atomic
formControl: true
dependencies: []
element: textarea
rootClass: t-textarea
cssFile: components/textarea/textarea.css

variants:
  outline:
    description: Bordered box on the surface; default textarea chrome.
  subtle:
    description: Soft-fill background, no border; for dense forms where the field chrome should recede.
  plain:
    description: Borderless; only the focus ring chromes the field.

sizes:
  sm:
    description: Compact density; matches `Input size="sm"`.
    tokens:
      pad-x: --t-space-2
      font-size: --t-text-xs
  md:
    description: Default size.
    tokens:
      pad-x: --t-space-3
      font-size: --t-text-sm
  lg:
    description: Emphatic; for hero forms and mobile-first layouts.
    tokens:
      pad-x: --t-space-4
      font-size: --t-text-base

visualStates:
  hover:
    description: Pointer is over the textarea.
  focus:
    description: Keyboard focus is on the textarea; the focus ring is visible.
  disabled:
    description: Interaction is suppressed; the disabled visual state is applied.
  invalid:
    description: The `invalid` prop is set; the field carries the error visual state.

props:
  resize:
    type: string
    values: [none, vertical, horizontal, both]
    responsive: false
    description: Maps to CSS `resize`. Absence-of-attr leaves the base CSS default (`vertical`). Set to `none` for a fixed-height field, `both` for free resizing.
  invalid:
    type: boolean
    responsive: false
    description: 'Marks the field as invalid for styling. Emits `data-invalid="true"` on the root. ARIA wiring (`aria-invalid`) is consumer-supplied or comes from the Field composite (tracked under #692).'

tokens:
  bg:
    fallback: --t-surface
    desc: Background color of the textarea box; the `subtle` variant overrides this.
  fg:
    fallback: --t-on-surface
    desc: Foreground (text) color.
  placeholder-fg:
    fallback: --t-on-surface-muted
    desc: Color of the placeholder text.
  border-color:
    fallback: --t-border
    desc: Border color in the `outline` variant.
  border-color-invalid:
    fallback: --t-danger
    desc: Border color when the field is invalid.
  radius:
    fallback: --t-radius-md
    desc: Corner rounding.
  pad-x:
    fallback: --t-space-3
    desc: Inline padding; the size variant overrides this.
  pad-y:
    fallback: --t-space-2
    desc: Block padding.
  font:
    fallback: --t-font-sans
    desc: Font stack.
  font-size:
    fallback: --t-text-sm
    desc: Font size; the size variant overrides this.
  focus-ring:
    fallback: --t-focus-ring
    desc: Color of the focus outline.

privateTokens:
  - --_bg
  - --_fg
  - --_placeholder-fg
  - --_border-color
  - --_border-color-invalid
  - --_radius
  - --_pad-x
  - --_pad-y
  - --_font
  - --_font-size
  - --_focus-ring
  - --_border-thickness
  - --_opacity
  - --_cursor
  - --_resize
  - --_bg-outline
  - --_border-color-outline
  - --_bg-subtle
  - --_bg-readonly
  - --_pad-x-sm
  - --_font-size-sm
  - --_pad-x-md
  - --_font-size-md
  - --_pad-x-lg
  - --_font-size-lg

examples:
  - id: default
    props: { placeholder: "Your message" }
  - id: variant-outline
    props: { variant: outline, placeholder: "Comment" }
  - id: variant-subtle
    props: { variant: subtle, placeholder: "Comment" }
  - id: variant-plain
    props: { variant: plain, placeholder: "Comment" }
  - id: size-sm
    props: { size: sm, placeholder: "Compact" }
  - id: size-lg
    props: { size: lg, placeholder: "Emphatic" }
  - id: rows-2
    props: { rows: 2, placeholder: "Two rows" }
  - id: rows-6
    props: { rows: 6, placeholder: "Six rows" }
  - id: resize-none
    props: { resize: none, placeholder: "Fixed height" }
  - id: resize-both
    props: { resize: both, placeholder: "Resize both directions" }
  - id: invalid
    props: { invalid: true, placeholder: "Required" }
  - id: disabled
    props: { disabled: true, placeholder: "Disabled" }
  - id: form-control
    props:
      name: comment
      form: contact
      required: true
      readOnly: true
      placeholder: "Form-control attributes pass-through"
