name: cluster
description: A horizontal layout primitive. Wraps children on the inline axis with consistent spacing.
kind: atomic
dependencies: []
element: div
rootClass: t-cluster
file: components/cluster/cluster.css

props:
  gap:
    type: string
    default: null
    responsive: true
    description: "Spacing between children. Accepts a token suffix from the `--t-space-*` scale (`0`–`8`)."
  align:
    type: string
    default: null
    responsive: true
    description: "Block-axis alignment of children. One of `start`, `center`, `end`, `stretch`, `baseline`."
  justify:
    type: string
    default: null
    responsive: true
    description: "Inline-axis distribution. One of `start`, `center`, `end`, `between`, `around`."

tokens:
  gap:
    fallback: --t-space-3
    desc: Default child spacing when `gap` is unset; overridable via `--t-cluster-gap`.

private:
  - --_gap

examples:
  - id: gap-3
    props: { gap: "3" }
  - id: gap-0
    props: { gap: "0" }
  - id: justify-between
    props: { gap: "3", justify: between }
  - id: justify-around
    props: { gap: "2", justify: around }
  - id: align-center
    props: { gap: "3", align: center }
  - id: align-baseline
    props: { gap: "2", align: baseline }
  - id: responsive-gap
    props: { gap: { base: "2", md: "4" } }
  - id: responsive-justify
    props: { gap: "3", justify: { base: start, md: between } }
