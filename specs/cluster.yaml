name: cluster
description: A horizontal layout primitive. Wraps children on the inline axis with consistent spacing.
kind: atomic
dependencies: []
root:
  kind: static
  tag: div
rootClass: t-cluster
cssFile: components/cluster/cluster.css

props:
  gap:
    type: string
    default: null
    responsive: true
    description: "Spacing between children. Accepts a token suffix from the `--t-space-*` scale (`0`–`8`)."
  align:
    type: string
    values: [start, center, end, stretch, baseline]
    default: null
    responsive: true
    description: "Block-axis alignment of children."
  justify:
    type: string
    values: [start, center, end, between, around]
    default: null
    responsive: true
    description: "Inline-axis distribution of children."

tokens:
  gap:
    fallback: --t-space-3
    desc: Default child spacing when `gap` is unset; overridable via `--t-cluster-gap`.
  align:
    fallback: stretch
    desc: Default block-axis alignment when `align` is unset; overridable via `--t-cluster-align`.
  justify:
    fallback: flex-start
    desc: Default inline-axis distribution when `justify` is unset; overridable via `--t-cluster-justify`.

privateTokens:
  - --_gap
  - --_align
  - --_justify
  - --_gap-0
  - --_gap-1
  - --_gap-2
  - --_gap-3
  - --_gap-4
  - --_gap-5
  - --_gap-6
  - --_gap-7
  - --_gap-8

examples:
  - id: gap-3
    props: { gap: "3" }
  - id: gap-0
    props: { gap: "0" }
  - id: justify-between
    props: { gap: "3", justify: between }
  - id: justify-around
    props: { gap: "2", justify: around }
  - id: align-center
    props: { gap: "3", align: center }
  - id: align-baseline
    props: { gap: "2", align: baseline }
  - id: responsive-gap
    props: { gap: { base: "2", md: "4" } }
  - id: responsive-justify
    props: { gap: "3", justify: { base: start, md: between } }

coverage:
  align: true
  justify: true
