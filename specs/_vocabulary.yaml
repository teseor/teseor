# Canonical vocabulary for component specs.

components:
  # Atoms
  - Button
  - Link
  - Input
  - Select
  - Textarea
  - Checkbox
  - Radio
  - Switch
  - Badge
  - Blockquote
  - Avatar
  - Icon
  - Kbd
  - Divider
  - Dot
  - Code
  - Codeblock
  - Heading
  - List
  - Text

  # Surfaces and feedback
  - Card
  - Alert
  - Banner
  - Skeleton
  - Progress

  # Navigation
  - Tabs
  - Tablist
  - Segmented
  - Breadcrumb
  - Pagination
  - Menu

  # Overlays
  - Tooltip
  - Popover
  - Modal
  - Drawer
  - Toast
  - Backdrop

  # Composite forms and data
  - Combobox
  - DatePicker
  - Slider
  - Stepper
  - Table
  - Tree
  - Accordion

  # Layout primitives
  - Stack
  - Cluster
  - Center
  - Sidebar

# Standard prop names.
props:
  - size
  - variant
  - intent
  - disabled
  - loading
  - error
  - density
  - layout
  - align

# Canonical descriptions for props with fixed meaning across components.
# Per-spec props override these in spec.props.<name>.description.
propDescriptions:
  variant: Visual style.
  intent: Semantic color.
  size: Size scale.
  density: Visual density.
  layout: Layout direction.
  align: Cross-axis alignment.
  gap: Child spacing (--t-space-* scale).
  justify: Main-axis distribution.
  disabled: Disables interaction.
  loading: Shows loading; disables interaction.
  error: Error state.

# Variant values. Canonical superset: visual hierarchy (solid|outline|ghost|link)
# plus semantic-color (default|muted|highlight). Each spec declares its own
# subset in `spec.variants` — Button uses the hierarchy values, Text uses the
# semantic-color values.
variants:
  - solid
  - outline
  - ghost
  - link
  - default
  - muted
  - highlight
  - subtle
  - plain

# Intent values (semantic color role).
intents:
  - neutral
  - primary
  - danger
  - success
  - warning
  - info

# Sizes (t-shirt scale).
sizes:
  - xs
  - sm
  - md
  - lg
  - xl

# Size mapping: component size → token suffix.
sizeMap:
  xs: 1
  sm: 2
  md: 4
  lg: 6
  xl: 8

# State names (aligned with ARIA where ARIA defines a name).
states:
  - disabled
  - loading
  - error
  - success
  - selected
  - expanded
  - pressed
  - checked

# BEM element-parts.
parts:
  - __header
  - __body
  - __footer
  - __title
  - __description
  - __icon
  - __label
  - __close
  - __trigger
  - __panel
  - __list
  - __item

# Event vocabulary (spec form).
# Consumed by codegen, the validator, and gen-docs via
# scripts/codegen/src/lib/vocabulary.ts.
events:
  # Verb registry — last camelCase token of every event name must
  # be a key here. Values are the canonical description surfaced in
  # generated docs.
  verbs:
    # User-initiated actions
    activate:    "Primary action triggered (click + Enter + Space)."
    select:      "User chose an item from a set."
    submit:      "User confirmed a value or form."
    cancel:      "User explicitly cancelled an action."
    clear:       "User cleared a value back to empty."
    dismiss:     "Surface closed (outside, escape, button — payload carries reason)."
    expand:      "Region expanded."
    collapse:    "Region collapsed."
    edit:        "Edit lifecycle (start, commit, cancel)."
    reorder:     "Items reordered by the user."
    retry:       "User retried a failed operation."
    abort:       "User aborted an in-progress operation."
    add:         "Item was added to a collection."
    remove:      "Item was removed from a collection."

    # Pure state-change verb
    change:      "A value changed. Bare 'change' or '<noun>Change'."

    # Sub-element gestures
    click:       "Click on a named sub-element (row, cell, column header)."
    doubleClick: "Double click on a sub-element."
    hover:       "Pointer entered a sub-element."
    focus:       "Focus moved into a sub-element."
    blur:        "Focus left a sub-element."
    drag:        "Drag lifecycle (start, over, end)."
    drop:        "Drop completed."
    resize:      "Element was resized."

    # Lifecycle / async
    load:        "Resource load completed successfully."
    start:       "Operation started."
    complete:    "Operation completed successfully."
    progress:    "Long-running operation reported progress."
    error:       "Operation failed with an error (DOM-convention noun-verb)."
    reach:       "Sentinel reached (used by 'endReach' for infinite scroll)."

  # Synonyms — author writes the key, validator suggests the value,
  # hard reject. Value '—' means "use the controllable pair
  # (open/onOpenChange) instead of declaring an event."
  synonyms:
    close:    dismiss
    hide:     dismiss
    update:   change
    modify:   change
    toggle:   change
    input:    change
    press:    activate
    open:     "—"

  # Event-name pattern — '<verb>' or '<subjectNoun><Verb>'
  # (camelCase). The LAST camelCase token must be a registered verb.
  pattern: "^([a-z]+|[a-z]+([A-Z][a-zA-Z0-9]+)+)$"

  # Built-in types the payload vocabulary allows. Extending this
  # list is the same review gate as adding a verb.
  builtins:
    Date:          "ECMAScript Date instance."
    MouseEvent:    "DOM MouseEvent."
    KeyboardEvent: "DOM KeyboardEvent."
    PointerEvent:  "DOM PointerEvent."
    FocusEvent:    "DOM FocusEvent."
    File:          "DOM File (uploads, drag-drop)."
    Error:         "ECMAScript Error subclass."
    HTMLElement:   "DOM HTMLElement (target references)."

# Vocab of DOM event names accepted as `<part>.<dom-event>` transition sources.
dom_events:
  click:         "Pointer click (mouse or touch)."
  pointerenter:  "Pointer entered the element."
  pointerleave:  "Pointer left the element."
  focusin:       "Focus moved into the element (or a descendant)."
  focusout:      "Focus left the element (and all descendants)."
  input:         "Form value changed."
  change:        "Form value committed."
  submit:        "Form submitted."
  animationend:  "CSS animation finished playing."

# Vocab of keys accepted as `key.<name>` transition sources. CamelCase here;
# the runtime maps to `KeyboardEvent.key`.
keys:
  escape:     "Escape key."
  enter:      "Enter / Return key."
  tab:        "Tab key."
  space:      "Space key."
  arrowUp:    "Arrow Up key."
  arrowDown:  "Arrow Down key."
  arrowLeft:  "Arrow Left key."
  arrowRight: "Arrow Right key."
  home:       "Home key."
  end:        "End key."
