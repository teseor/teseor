name: code
description: Inline monospace fragment for short code spans in prose.
kind: atomic
dependencies: []
element: code
rootClass: t-code
cssFile: components/code/code.css

tokens:
  bg:
    fallback: --t-surface-muted
    desc: Background fill for the inline span.
  fg:
    fallback: --t-on-surface-muted
    desc: Text color.
  pad-x:
    fallback: --t-space-1
    desc: Inline padding.
  radius:
    fallback: --t-radius-sm
    desc: Corner radius.
  font:
    fallback: --t-font-mono
    desc: Monospace family.

privateTokens:
  - --_bg
  - --_fg
  - --_pad-x
  - --_radius
  - --_font
  - --_min-h

examples:
  - id: default
    props: {}
