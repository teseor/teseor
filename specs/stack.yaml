name: stack
description: A vertical layout primitive. Stacks children on the block axis with consistent spacing.
kind: atomic
dependencies: []
root:
  kind: static
  tag: div
rootClass: t-stack
cssFile: components/stack/stack.css

props:
  gap:
    type: string
    default: null
    responsive: true
    description: "Spacing between children. Accepts a token suffix from the `--t-space-*` scale (`0`–`8`)."
  align:
    type: string
    values: [start, center, end, stretch]
    default: null
    responsive: true
    description: "Inline-axis alignment of children."

tokens:
  gap:
    fallback: --t-space-3
    desc: Default child spacing when `gap` is unset; overridable via `--t-stack-gap`.
  align:
    fallback: stretch
    desc: Default inline-axis alignment when `align` is unset; overridable via `--t-stack-align`.

privateTokens:
  - --_gap
  - --_align
  - --_gap-0
  - --_gap-1
  - --_gap-2
  - --_gap-3
  - --_gap-4
  - --_gap-5
  - --_gap-6
  - --_gap-7
  - --_gap-8

examples:
  - id: gap-3
    props: { gap: "3" }
  - id: gap-0
    props: { gap: "0" }
  - id: align-center
    props: { gap: "4", align: center }
  - id: align-stretch
    props: { gap: "2", align: stretch }
  - id: responsive-gap
    props: { gap: { base: "2", md: "4", lg: "6" } }
  - id: responsive-align
    props: { gap: "3", align: { base: start, md: center } }
  - id: gap-and-align
    props: { gap: "5", align: end }

coverage:
  align: true
