name: modal
description: A modal overlay that traps focus and inerts the rest of the page until dismissed.
kind: composite
dependencies: []
cssFile: components/modal/modal.css

events:
  dismiss:
    description: "Fired when the dialog closes; the reason tells the consumer whether the user clicked outside, pressed Escape, or used the trigger."
    payload:
      reason:
        type: enum
        values: ["outside", "escape", "button"]

parts:
  trigger:
    fromChildren: true
    rootClass: t-modal-trigger
    props:
      open:
        type: boolean
        default: false
        pattern: controllable
        responsive: false
        description: "Open state. Uncontrolled by default; pass `open` and optionally `onOpenChange` to drive it from the consumer."
    privateTokens:
      - --_anchor

  content:
    element: div
    rootClass: t-modal
    a11y:
      role: dialog
    overlay:
      anchor: trigger
      anchorVar: --t-modal-anchor
      modal: true
    states:
      closed:
        on:
          trigger.click: open
      open:
        on:
          trigger.click:   { to: closed, emits: { dismiss: { reason: button  } } }
          key.escape:      { to: closed, emits: { dismiss: { reason: escape  } } }
          outside.click:   { to: closed, emits: { dismiss: { reason: outside } } }
    props:
      title:
        type: string
        slot: true
        default: null
        description: "Modal body text. Plain string only; rich content support lands when the spec grows a real content slot."
    tokens:
      bg:
        fallback: --t-bg
        desc: Background fill.
      fg:
        fallback: --t-on-bg
        desc: Text color.
      pad:
        fallback: --t-space-5
        desc: Inner padding.
      radius:
        fallback: --t-radius-md
        desc: Corner radius.
    privateTokens:
      - --_bg
      - --_fg
      - --_pad
      - --_radius
      - --_anchor

examples:
  - id: default
    props: { title: "Are you sure?" }
