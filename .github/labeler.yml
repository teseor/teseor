"pkg: css":
  - changed-files:
      - any-glob-to-any-file:
          - packages/css/**

"pkg: docs-css":
  - changed-files:
      - any-glob-to-any-file:
          - apps/docs-css/**

"type: ci":
  - changed-files:
      - any-glob-to-any-file:
          - .github/**

"type: docs":
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - apps/docs-css/**

"component: button":
  - changed-files:
      - any-glob-to-any-file:
          - packages/css/src/components/actions/button/**

"component: card":
  - changed-files:
      - any-glob-to-any-file:
          - packages/css/src/components/data-display/card/**

"component: layout":
  - changed-files:
      - any-glob-to-any-file:
          - packages/css/src/layout/**
