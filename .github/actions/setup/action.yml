name: Setup
description: Install pnpm and Node.js dependencies

inputs:
  registry-url:
    description: npm registry URL (for publishing workflows)
    required: false

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
        registry-url: ${{ inputs.registry-url || '' }}
    - run: pnpm install
      shell: bash
