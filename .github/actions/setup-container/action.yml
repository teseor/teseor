name: Setup Container
description: Install pnpm/Node.js and build CSS inside a Playwright container

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install dependencies
      shell: bash
      run: pnpm install

    - name: Build CSS
      shell: bash
      run: pnpm nx build css
