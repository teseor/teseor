name: size-report

on:
  workflow_run:
    workflows: [size-data]
    types: [completed]

permissions:
  pull-requests: write
  actions: read

jobs:
  report:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - id: artifact
        name: Download size-data artifact
        uses: actions/download-artifact@v8
        with:
          name: size-data
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      - if: steps.artifact.outcome == 'success'
        id: render
        name: Render size table
        run: |
          set -e
          pr_number=$(cat pr-number.txt)
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          {
            echo 'body<<EOT'
            echo '### Bundle size'
            echo ''
            echo '| Artifact | Size | Gzip | Limit |'
            echo '| --- | --- | --- | --- |'
            # The node script is single-quoted on purpose: ${...} are JS template
            # expressions for node, not shell parameters.
            # shellcheck disable=SC2016
            node -e '
              const data = JSON.parse(require("fs").readFileSync("size-current.json", "utf8"));
              for (const entry of data) {
                const size = entry.size != null ? (entry.size / 1024).toFixed(2) + " KB" : "—";
                const gz = entry.passed != null ? (entry.size != null && entry.gzipSize != null ? (entry.gzipSize / 1024).toFixed(2) + " KB" : "—") : "—";
                const limit = entry.limit || "—";
                process.stdout.write(`| ${entry.name} | ${size} | ${gz} | ${limit} |\n`);
              }
            '
            echo ''
            echo '### Per-component breakpoint share (brotli)'
            echo ''
            echo '| Component | Brotli | BP share | % BP |'
            echo '| --- | --- | --- | --- |'
            # shellcheck disable=SC2016
            node -e '
              const rows = JSON.parse(require("fs").readFileSync("bp-share.json", "utf8"));
              for (const row of rows) {
                const total = row.brotli != null ? row.brotli + " B" : "—";
                const share = row.bpShare != null ? row.bpShare + " B" : "—";
                const pct = row.bpPct != null ? row.bpPct.toFixed(1) + "%" : "—";
                const flag = row.bpPct >= 50 ? " ⚠" : "";
                process.stdout.write(`| ${row.name} | ${total} | ${share} | ${pct}${flag} |\n`);
              }
            '
            echo ''
            echo '> The ⚠ marker fires when a single component crosses 50% breakpoint share — soft signal to revisit the per-breakpoint cost decision, not a CI failure.'
            echo 'EOT'
          } >> "$GITHUB_OUTPUT"
      - if: steps.artifact.outcome == 'success'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          number: ${{ steps.render.outputs.pr_number }}
          header: size-report
          message: ${{ steps.render.outputs.body }}
