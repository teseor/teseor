name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: detect
        uses: ./.github/actions/changes

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so `lint:codegen-tests` can diff the PR against its
          # base. Shallow checkouts leave `origin/<base>` unresolved and the
          # check would fail loud (as designed) on every PR.
          fetch-depth: 0
      - name: Fetch base ref
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: git fetch --quiet origin "$BASE_REF"
      - uses: ./.github/actions/setup
      - run: pnpm lint

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Lint workflow files
        run: |
          curl -sSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz | tar -xz actionlint
          ./actionlint -color

  typecheck:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  test-unit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      # Wrapper tests import generated component .tsx files which `import
      # "@teseor/css/components/<name>.css"`. Resolve via the package's
      # `dist/` exports — build CSS first so those imports resolve.
      - run: pnpm --filter @teseor/css build
      - run: pnpm test

  test-e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: pnpm build:css
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  gen-drift:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: pnpm gen
      - name: Fail if generated output drifted
        run: |
          if ! git diff --quiet; then
            echo "pnpm gen produced changes that are not committed."
            git --no-pager diff
            exit 1
          fi

  verify-no-dev-leak:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: pnpm -r --if-present run build
      - run: node scripts/hooks/verify-no-dev-leak.js

  changeset:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Require changeset when packages/ changed
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -e
          git fetch --quiet origin "$BASE_REF"
          changed=$(git diff --name-only "origin/$BASE_REF...HEAD")
          if echo "$changed" | grep -Eq '^packages/'; then
            if ! echo "$changed" | grep -Eq '^\.changeset/.+\.md$'; then
              echo "packages/ changed but no .changeset/*.md added."
              echo "Add a changeset with: pnpm changeset"
              exit 1
            fi
          fi
