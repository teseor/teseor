name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    env:
      HUSKY: '0'
    permissions:
      contents: write
      pull-requests: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          registry-url: https://registry.npmjs.org

      - run: pnpm nx build css

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset:version
          publish: pnpm changeset:publish
          title: "Release @teseor/css"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.PUSH_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Update release PR and retrigger CI
        if: steps.changesets.outputs.hasChangesets == 'true'
        run: |
          VERSION=$(jq -r '.version' packages/css/package.json)
          PR=$(gh pr list --head changeset-release/main --json number --jq '.[0].number')
          if [ -n "$PR" ]; then
            gh pr edit "$PR" --title "Release @teseor/css v${VERSION}"
            # Close and reopen to retrigger CI checks.
            # The changesets action force-pushes a new commit, but CI may have
            # run against the previous SHA and the new push doesn't always
            # trigger a fresh run (GitHub race condition).
            gh pr close "$PR"
            sleep 2
            gh pr reopen "$PR"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.PUSH_TOKEN }}

      - name: Create GitHub Releases
        if: steps.changesets.outputs.published == 'true'
        run: |
          for pkg in $(echo '${{ steps.changesets.outputs.publishedPackages }}' | jq -r '.[] | @base64'); do
            name=$(echo $pkg | base64 -d | jq -r '.name')
            version=$(echo $pkg | base64 -d | jq -r '.version')
            gh release create "${name}@${version}" \
              --title "${name}@${version}" \
              --notes "See CHANGELOG.md for details" \
              --target main || echo "Release ${name}@${version} already exists"
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages
        if: steps.changesets.outputs.published == 'true'
        run: |
          echo "@teseor:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc
          for dir in packages/*/; do
            if [ -f "$dir/package.json" ] && [ "$(jq -r '.private // false' "$dir/package.json")" != "true" ]; then
              echo "Publishing $(jq -r '.name' "$dir/package.json") to GitHub Packages"
              npm publish "$dir" --registry=https://npm.pkg.github.com
            fi
          done
