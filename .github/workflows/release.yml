name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    env:
      HUSKY: '0'
    permissions:
      contents: write
      pull-requests: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install

      - name: Build packages
        run: pnpm nx build css

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset:version
          publish: pnpm changeset:publish
          title: "Release @teseor/css"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.PUSH_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Releases
        if: steps.changesets.outputs.published == 'true'
        run: |
          for pkg in $(echo '${{ steps.changesets.outputs.publishedPackages }}' | jq -r '.[] | @base64'); do
            name=$(echo $pkg | base64 -d | jq -r '.name')
            version=$(echo $pkg | base64 -d | jq -r '.version')
            gh release create "${name}@${version}" \
              --title "${name}@${version}" \
              --notes "See CHANGELOG.md for details" \
              --target main || echo "Release ${name}@${version} already exists"
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages
        if: steps.changesets.outputs.published == 'true'
        run: |
          echo "@teseor:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc
          for dir in packages/*/; do
            if [ -f "$dir/package.json" ] && [ "$(jq -r '.private // false' "$dir/package.json")" != "true" ]; then
              echo "Publishing $(jq -r '.name' "$dir/package.json") to GitHub Packages"
              npm publish "$dir" --registry=https://npm.pkg.github.com
            fi
          done
