name: Update Snapshots

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to update snapshots on
        required: true
        type: string

jobs:
  update:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
    permissions:
      contents: write
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: pnpm install
      - run: pnpm nx build css

      - name: Update snapshots
        run: npx playwright test --config=packages/css/playwright.config.ts --update-snapshots --grep visual

      - name: Commit updated snapshots
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "packages/css/src/**/*-visual.png"
          if git diff --cached --quiet; then
            echo "No snapshot changes"
          else
            git commit -m "[CSS] test(visual): update snapshots from CI"
            git push
          fi
