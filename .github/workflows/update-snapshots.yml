name: Update Snapshots

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to update snapshots on
        required: true
        type: string

jobs:
  update:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.0-noble
    permissions:
      contents: write
    env:
      HOME: /root
    steps:
      - name: Configure container
        run: |
          mkdir -p /root/.docker && echo '{}' > /root/.docker/config.json
          git config --global init.defaultBranch main
          git config --global advice.detachedHead false

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          token: ${{ secrets.PUSH_TOKEN }}

      - uses: ./.github/actions/setup-container

      - name: Update snapshots
        run: npx playwright test --config=packages/css/playwright.config.ts --update-snapshots --grep visual

      - name: Commit updated snapshots
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "packages/css/test-utils/snapshots/"
          if git diff --cached --quiet; then
            echo "No snapshot changes"
          else
            git commit -m "[CSS] test(visual): update snapshots from CI"
            git push
          fi
