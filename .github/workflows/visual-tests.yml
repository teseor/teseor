name: Visual Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  visual-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      LOST_PIXEL_API_KEY: ${{ secrets.LOST_PIXEL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build CSS
        run: pnpm nx build css

      - name: Install Playwright
        run: npx playwright install chromium

      - name: Run visual tests
        id: test
        run: pnpm nx test css
        continue-on-error: true

      - name: Update snapshots if tests failed on PR
        if: steps.test.outcome == 'failure' && github.event_name == 'pull_request'
        run: npx playwright test --config=packages/css/playwright.config.ts --update-snapshots --grep visual

      - name: Commit updated snapshots
        if: steps.test.outcome == 'failure' && github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "packages/css/src/**/*-visual.png"
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit"
            exit 1
          else
            git commit -m "[CSS] test(visual): update snapshots from CI"
            git push
          fi

      - name: Fail if tests failed and no snapshots updated
        if: steps.test.outcome == 'failure'
        run: |
          echo "Visual tests failed. Check if snapshots were auto-updated (new commit pushed)."
          exit 1

      - name: Upload to Lost Pixel
        if: steps.test.outcome == 'success' && env.LOST_PIXEL_API_KEY != ''
        uses: lost-pixel/lost-pixel@v3.22.0
        env:
          LOST_PIXEL_PROJECT_ID: ${{ secrets.LOST_PIXEL_PROJECT_ID }}
          LOST_PIXEL_API_KEY: ${{ secrets.LOST_PIXEL_API_KEY }}
