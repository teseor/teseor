name: Visual Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  visual-test:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
    env:
      LOST_PIXEL_API_KEY: ${{ secrets.LOST_PIXEL_API_KEY }}
      HOME: /root
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install

      - name: Build CSS
        run: pnpm nx build css

      - name: Run visual tests
        run: pnpm nx test css

      - name: Upload to Lost Pixel
        if: github.event_name == 'push' && env.LOST_PIXEL_API_KEY != ''
        uses: lost-pixel/lost-pixel@v3.22.0
        env:
          LOST_PIXEL_PROJECT_ID: ${{ secrets.LOST_PIXEL_PROJECT_ID }}
          LOST_PIXEL_API_KEY: ${{ secrets.LOST_PIXEL_API_KEY }}
