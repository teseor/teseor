name: Visual Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  visual-test:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
    env:
      LOST_PIXEL_API_KEY: ${{ secrets.LOST_PIXEL_API_KEY }}
      HOME: /root
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install

      - name: Build CSS
        run: pnpm nx build css

      - name: Run visual tests
        id: test
        run: pnpm nx test css
        continue-on-error: true

      - name: Post update instructions on failure
        if: steps.test.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const updateUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/workflows/update-snapshots.yml`;
            const body = [
              '### Visual tests failed',
              '',
              'Snapshots need updating.',
              '',
              `**[Update snapshots from CI](${updateUrl})** (enter branch: \`${branch}\`)`,
              '',
              'Or run locally:',
              '```bash',
              './scripts/visual-test-docker.sh --update',
              '```',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes('### Visual tests failed'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Upload to Lost Pixel
        if: steps.test.outcome == 'success' && github.event_name == 'push' && env.LOST_PIXEL_API_KEY != ''
        uses: lost-pixel/lost-pixel@v3.22.0
        env:
          LOST_PIXEL_PROJECT_ID: ${{ secrets.LOST_PIXEL_PROJECT_ID }}
          LOST_PIXEL_API_KEY: ${{ secrets.LOST_PIXEL_API_KEY }}

      - name: Fail if visual tests failed
        if: steps.test.outcome == 'failure'
        run: exit 1
